{{define "base"}}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · Literary Lions</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">🦁 Literary Lions</a>
    <nav>
      {{if .User}}
        <span class="nav-user">Hello, <strong>{{.User.Username}}</strong></span>
        <a class="btn btn-primary" href="/post/new/">New post</a>
        <a href="/profile">
            <img class="profile" src="/static/profile.jpeg" alt="profile">
        </a>
        <form method="post" action="/logout" class="inline-form">
          <button type="submit" class="btn btn-quiet">Log out</button>
        </form>
      {{else}}
        <a class="btn btn-quiet" href="/login">Log in</a>
        <a class="btn btn-primary" href="/register">Register</a>
      {{end}}
    </nav>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
  <footer class="site-footer">A cozy forum for talking about books. Developed by Hoang, Aman & Xinyu</footer>
</body>
</html>

{{end}}
