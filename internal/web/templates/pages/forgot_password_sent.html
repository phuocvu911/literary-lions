{{ define "title"}}Forgot Password Sent{{end}}

{{define "content"}}
<div class="form-page form-narrow">
    <div class="success-card">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h2 class="success-title">Reset Link Sent!</h2>
        <p class="success-message">We've emailed you a password reset link. Please check your inbox and follow the instructions.</p>
        <p class="success-hint">Didn't receive it? Check your spam folder or <a href="/forgot-password">try again</a>.</p>
        <a href="/login" class="btn btn-primary">Back to Login</a>
    </div>
</div>
{{end}}
